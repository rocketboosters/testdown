[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testdown"
version = "1.0.0"
authors = [
    {name = "Scott Ernst", email = "swernst@gmail.com"},
]
description = "Markdown-driven testing in Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
data = [
    "pandas>=3.0.1",
    "polars>=1.38.1",
    "dftxt>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.uv]
package = true

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["example"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "ERA",  # eradicate (commented-out code)
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "FLY",  # flynt
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # flake8-2020
]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",    # type annotations not required in tests
    "D",      # docstrings not required in tests
    "S",      # security checks relaxed in tests
    "SLF001", # private member access allowed in tests
]
"testdown/_types.py" = [
    "PLC0415", # inline imports are intentional for optional runtime dependencies
    "TRY002",  # built-in exception types are appropriate here
    "TRY003",  # descriptive error messages are intentional for usability
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "dftxt.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=testdown --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["testdown"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
